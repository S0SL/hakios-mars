# devices/mars/device.conf: what this device repository is. tools/hakios-device.py reads it; docs/porting/repositories.md has
# every word, and the device's page (docs/devices/mars.md) is made from it, so that the status is said in one place.
#
# Every line below is `missing` on purpose: nothing of this phone has been run yet, and a status is only `works` once it has
# been seen working on the phone itself (docs/porting/index.md, step 4). Change a line the day a part works, with how it is
# turned on; `partial` while it is written and not yet seen.

device mars
	title       Xiaomi Mi 11 Pro
	vendor      Xiaomi
	soc         sm8350
	defconfig   mars_defconfig
	firmware    pull-firmware.sh
	maintainer  the port's maintainer (README.md)
	status      display     missing   not started: step 2 shows only UEFI's framebuffer; the panel is 1440x3200 at 120 Hz
	status      touch       missing   not started: identified as FocalTech "fts" on spi@a8c000, IRQ GPIO 23, reset 22 (README.md)
	status      buttons     missing   not started
	status      cpu         missing   not started: cpus=8 bootcpu=7 in soc/configs/sm8350.config; the cores are not clocked yet
	status      gpu         missing   not started: an Adreno 660 -- a660 like the reference's 642L, but hakios.adreno.c's addresses are SC7280's
	status      storage     missing   not started: UFS 3.1, and hakios.ufs.c drives the SM7325 controller
	status      audio       missing   not started: needs fw-audio/ from the phone
	status      battery     missing   not started: the level comes through the audio DSP, so after audio
	status      haptic      missing   not started: the motor's chip is not identified yet
	status      camera      missing   not started
	status      torch       missing   not started
	status      wifi        missing   not started: a WCN6855, not the reference's WCN6750 -- the QMI/wlfw flow differs (README.md)
	status      bluetooth   missing   not started: the same WCN6855 as Wi-Fi
	status      cellular    missing   not started: the modem's addresses go in soc.args first (pull-soc.sh)
	status      thermal     missing   not started: the SoC's sensors are not read yet, so nothing stops a hot run
