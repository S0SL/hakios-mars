# devices/mars/soc/soc.conf: what this SoC layer is: the facts of a Qualcomm SM8350-family chip, whatever phone it is in.
# A phone with this SoC includes configs/sm8350.config from its defconfig. docs/porting/repositories.md has every word.

soc sm8350
	title       Qualcomm SM8350 family (Snapdragon 888, 888+; "lahaina")
	vendor      Qualcomm
	cores       8, the biggest is core 7 (1x Cortex-X1, 3x A78, 4x A55)
	gpu         Adreno 660
	maintainer  the port's maintainer (README.md)
